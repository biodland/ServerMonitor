services:
  servermonitor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: servermonitor:latest
    container_name: servermonitor
    # Host networking so the dashboard/API port and NIC inventory match the host.
    network_mode: host
    # Exposes host devices (including /dev/ipmi0 when present) for in-band IPMI,
    # and enables DMI/SMBIOS access through the mounted sysfs.
    privileged: true
    volumes:
      - /sys:/sys:ro
      - /proc:/proc:ro
      - ./appsettings.example.json:/app/appsettings.local.json:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    